<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap2Review — Field Admin</title>
<style>
  :root{--ink:#12141a;--accent:#2f5eff;--muted:#8a8f9a;--line:#e8e9ed;--bg:#fbfbfc}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 0 48px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;
    position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
  h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--muted);margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:600;margin:0 0 6px}
  input,select{width:100%;padding:13px;font-size:16px;border:1px solid var(--line);
    border-radius:10px;outline:none;background:#fff;font-family:inherit}
  input:focus,select:focus{border-color:var(--accent)}
  .field{margin-bottom:14px}
  .row{display:flex;gap:8px}
  .btn{width:100%;padding:15px;font-size:15px;font-weight:600;border:0;border-radius:11px;
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.4}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:10px 14px;font-size:13px}
  .hit{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:8px;cursor:pointer;background:#fff}
  .hit:active{background:#f7f8fa}
  .hit.on{border-color:var(--accent);background:#f5f8ff}
  .hit .n{font-size:14px;font-weight:600}
  .hit .a{font-size:12px;color:var(--muted);margin-top:2px}
  .stats{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .stats b{color:var(--ink);font-size:14px}
  .cardrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .cardrow input{flex:1}
  .cardrow select{width:100px}
  .cardrow input.price{flex:none;width:72px}
  .del{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer}
  .link{background:#f7f8fa;border-radius:9px;padding:11px;font-size:12px;
    font-family:ui-monospace,monospace;word-break:break-all;margin:8px 0}
  .tagbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
  .tagbox .lbl{font-size:14px;font-weight:600;margin-bottom:2px}
  .tagbox .ty{font-size:12px;color:var(--muted);text-transform:capitalize}
  .ok{color:#1a7f4b;font-weight:600}
  .warn{background:#fff8e6;border:1px solid #f0dfae;border-radius:11px;padding:13px;
    font-size:13px;line-height:1.5;margin-bottom:12px}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
  .step{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
  .checklist div{font-size:13px;color:var(--muted);padding:5px 0;display:flex;gap:9px;line-height:1.45}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex-shrink:0}
  .err{color:#c0392b;font-size:13px;margin-top:8px}
  .setup input{font-family:ui-monospace,monospace;font-size:13px}
</style>
</head>
<body>

<header>
  <span class="brand">Tap2Review</span>
  <div style="display:flex;gap:8px">
    <button class="btn ghost sm" onclick="S.view='setup';render()">Settings</button>
    <button class="btn ghost sm" onclick="resetAll()">New</button>
  </div>
</header>

<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ------------------------------------------------------------------ config
   Stored on the device once, in localStorage. Never hard-code these.
------------------------------------------------------------------ */
// Default points at the live deploy (Vercel) — override in Settings if you
// ever move it to a custom domain, no code change needed.
const DEFAULT_DASHBOARD_URL = 'https://dashboard-app-omega-beige.vercel.app';

const CFG = {
  get fnUrl(){ return localStorage.getItem('t2r_fn') || '' },
  get token(){ return localStorage.getItem('t2r_token') || '' },
  get dashUrl(){ return localStorage.getItem('t2r_dash') || DEFAULT_DASHBOARD_URL },
  set(fn, tok, dash){
    localStorage.setItem('t2r_fn', fn); localStorage.setItem('t2r_token', tok);
    localStorage.setItem('t2r_dash', dash || DEFAULT_DASHBOARD_URL);
  },
  ok(){ return this.fnUrl && this.token }
};

// The link a client just clicks — no UUID typing, ever. Built the moment
// a business exists, same as the tap-card URLs the backend hands back.
function dashboardUrl(businessId){
  return `${CFG.dashUrl.replace(/\/$/, '')}/?business=${businessId}`;
}

async function api(action, payload = {}) {
  if (!CFG.fnUrl) throw new Error('No function URL set. Add it in one-time setup.');
  let r;
  try {
    r = await fetch(CFG.fnUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': CFG.token },
      body: JSON.stringify({ action, ...payload })
    });
  } catch (e) { throw new Error('Could not reach the function. Check the URL and your connection.'); }
  const text = await r.text();
  let d;
  try { d = JSON.parse(text); }
  catch { throw new Error(`Got a web page instead of data (HTTP ${r.status}). Your function URL is wrong or the function isn't deployed — it should end in /admin-api.`); }
  if (!r.ok) throw new Error(d.error || ('Request failed (HTTP ' + r.status + ')'));
  return d;
}

const NFC_OK = ('NDEFReader' in window);

/* ------------------------------------------------------------------ state */
const DEFAULT_CARDS = () => [
  {label:'Front counter',type:'stand',price:''},
  {label:'Table 1',type:'placard',price:''},
  {label:'Table 2',type:'placard',price:''}
];

let S = {
  view: CFG.ok() ? 'search' : 'setup',
  query: '', hits: [], picked: null,
  existing: null, // {business, cards} from lookup_business once a result is picked
  quickLink: null, // {business, slug, url} from quick_link — the walk-in-the-door link
  contact: { name:'', title:'', email:'', phone:'' },
  cards: DEFAULT_CARDS(),
  created: null, busy: false, err: ''
};

function subtotal(){
  return S.cards.reduce((sum,c)=> sum + (parseFloat(c.price) || 0), 0);
}

// Called on every price keystroke instead of a full render() — a full
// render() replaces the whole app's innerHTML, which destroys and
// recreates the input you're actively typing in (killing focus/cursor
// and jumping the page). Just patch the one number that actually changed.
function updateSubtotal(){
  const el = document.getElementById('collectTotal');
  if (el) el.textContent = '$' + subtotal().toFixed(2);
}

function resetAll(){
  S = {...S, view:'search', query:'', hits:[], picked:null, existing:null, quickLink:null,
       contact:{name:'',title:'',email:'',phone:''},
       cards: DEFAULT_CARDS(), created: null, err:''};
  render();
}

/* ------------------------------------------------------------------ actions */
async function doSearch(){
  if(!S.query.trim()) return;
  S.busy = true; S.err=''; render();
  try { S.hits = (await api('search_place',{query:S.query})).places; }
  catch(e){ S.err = e.message; }
  S.busy = false; render();
}

// Picking a result checks whether this business already has a real row —
// e.g. a quick demo card already written via linkmaker.html, or a scraped
// lead — so Step 3 can pre-fill with what actually exists instead of
// offering blank cards that would duplicate an already-written tag.
async function pickResult(i){
  S.picked = S.hits[i];
  S.existing = null;
  S.quickLink = null;
  S.cards = DEFAULT_CARDS();
  render();
  try {
    const d = await api('lookup_business', { place_id: S.picked.place_id });
    if (d.business) {
      S.existing = d.business;
      if (d.cards.length) {
        S.cards = d.cards.map(c => ({ id: c.id, label: c.label, type: c.card_type, price: '' }));
      }
    }
  } catch (e) { /* lookup is best-effort — silently fall back to blank cards */ }
  render();
}

// The walk-in-the-door link: one working card, right now, before contact
// info or pricing exist. Field flow is search -> pick -> this -> sell.
// Reuses the same `businesses` row create_business would (find-or-create
// by place_id, see quick_link in admin-api) so nothing gets duplicated —
// then re-runs lookup_business so Step 3 picks up this exact card's `id`
// and updates it in place later instead of minting a second one.
async function getQuickLink(){
  S.busy = true; S.err=''; render();
  try {
    const d = await api('quick_link', {
      place_id: S.picked.place_id, name: S.picked.name,
      review_count: S.picked.review_count, rating: S.picked.rating,
      label: 'Stand', type: 'stand'
    });
    S.quickLink = d;
    const look = await api('lookup_business', { place_id: S.picked.place_id });
    if (look.business) {
      S.existing = look.business;
      if (look.cards.length) {
        S.cards = look.cards.map(c => ({ id: c.id, label: c.label, type: c.card_type, price: '' }));
      }
    }
  } catch(e){ S.err = e.message; }
  S.busy = false; render();
}

async function doCreate(){
  S.busy = true; S.err=''; render();
  try {
    const d = await api('create_business', {
      name: S.picked.name, place_id: S.picked.place_id,
      review_count: S.picked.review_count, rating: S.picked.rating,
      contact: S.contact, cards: S.cards.filter(c=>c.label.trim())
    });
    S.created = d; S.view = 'tags';
  } catch(e){ S.err = e.message; }
  S.busy = false; render();
}

async function writeTag(url, i){
  const el = document.getElementById('st'+i);
  if(!NFC_OK){ return; }
  el.textContent = 'Hold the card to the top of your phone…';
  try {
    await new NDEFReader().write({ records:[{ recordType:'url', data:url }] });
    el.innerHTML = '<span class="ok">✓ Written — tap-test it now</span>';
  } catch(e){
    el.innerHTML = '<span style="color:#c0392b">Write failed: '+e.message+'</span>';
  }
}

function copy(url,i){
  navigator.clipboard.writeText(url);
  const el = document.getElementById('st'+i);
  el.innerHTML = '<span class="ok">✓ Copied — paste into NFC Tools › Write › URL</span>';
}

function copyDash(url){
  navigator.clipboard.writeText(url);
  const el = document.getElementById('stdash');
  el.innerHTML = '<span class="ok">✓ Copied — ready to text or email</span>';
}

/* ------------------------------------------------------------------ views */
function render(){
  const a = document.getElementById('app');
  if(S.view==='setup') return a.innerHTML = vSetup();
  if(S.view==='tags')  return a.innerHTML = vTags();
  a.innerHTML = vSearch() + (S.picked ? vDetails() : '');
  const q = document.getElementById('q');
  if(q && document.activeElement !== q){ q.value = S.query; }
}

function vSetup(){ return `
  <div class="card setup">
    <h2>One-time setup</h2>
    <p class="sub">Paste these once. They stay on this phone only.</p>
    <div class="field"><label>Admin function URL</label>
      <input id="fn" placeholder="https://xxxx.functions.supabase.co/admin-api" value="${CFG.fnUrl}"></div>
    <div class="field"><label>Admin token</label>
      <input id="tk" placeholder="your ADMIN_TOKEN" value="${CFG.token}"></div>
    <div class="field"><label>Dashboard URL</label>
      <input id="dash" placeholder="https://your-dashboard.vercel.app" value="${CFG.dashUrl}"></div>
    <button class="btn" onclick="CFG.set(fn.value.trim(),tk.value.trim(),dash.value.trim());S.view='search';render()">Save</button>
    <p class="note">${NFC_OK
      ? 'NFC writing is available on this device — you can program cards right here.'
      : 'This device can’t write NFC from the browser (iPhones don’t support it). You’ll get copy buttons to paste into the NFC Tools app instead.'}</p>
  </div>`;
}

function vSearch(){ return `
  <div class="card">
    <div class="step">Step 1</div>
    <h2>Find the business</h2>
    <p class="sub">Type the name — Google gives us the Place ID automatically.</p>
    <div class="row">
      <input id="q" placeholder="Bluebird Coffee, Kennedy St"
             onchange="S.query=this.value" oninput="S.query=this.value"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn sm" onclick="doSearch()" ${S.busy?'disabled':''}>${S.busy?'…':'Search'}</button>
    </div>
    ${S.err?`<div class="err">${S.err}</div>`:''}
    <div style="margin-top:14px">
      ${S.hits.map((h,i)=>`
        <div class="hit ${S.picked&&S.picked.place_id===h.place_id?'on':''}" onclick="pickResult(${i})">
          <div class="n">${h.name}</div>
          <div class="a">${h.address||''}</div>
          <div class="stats">
            <span><b>${h.review_count}</b> reviews</span>
            <span><b>${h.rating??'—'}</b> ★</span>
            ${h.velocity_estimate?`<span>~<b>${h.velocity_estimate}</b> reviews/mo (est.)</span>`:''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function vDetails(){ return `
  ${S.existing && S.existing.stage !== 'customer' ? `
    <p class="note" style="margin:-4px 0 12px">Already in the system as a lead
      (stage: ${S.existing.stage}) — creating cards below moves it to customer.</p>` : ''}
  <div class="card">
    <div class="step">Before you go in</div>
    <h2>${S.quickLink ? 'Your working link' : 'Get one link now'}</h2>
    ${S.quickLink ? `
      <p class="sub">Walk in with this — write it to a card or copy it. It's already attached to
        ${S.picked.name}; finishing the sale below reuses this exact card instead of making a new one.</p>
      <div class="link">${S.quickLink.url}</div>
      <div class="row">
        ${NFC_OK?`<button class="btn" onclick="writeTag('${S.quickLink.url}','quick')">Write to card</button>`:''}
        <button class="btn ghost" onclick="copy('${S.quickLink.url}','quick')">Copy link</button>
      </div>
      <div class="note" id="stquick"></div>` : `
      <p class="sub">Skip contact info and pricing for now — get one working link you can hand over
        or write to a card before you've made the sale.</p>
      <button class="btn" onclick="getQuickLink()" ${S.busy?'disabled':''}>${S.busy?'…':'Get a link now'}</button>
      ${S.err?`<div class="err">${S.err}</div>`:''}`}
  </div>
  <div class="card">
    <div class="step">Step 2</div>
    <h2>Who to reach</h2>
    <p class="sub">Receipt, dashboard login, and the replacement guarantee all go here.</p>
    <div class="row"><div class="field" style="flex:1"><label>Name</label>
      <input value="${S.contact.name}" oninput="S.contact.name=this.value" placeholder="Marco"></div>
      <div class="field" style="flex:1"><label>Title</label>
      <input value="${S.contact.title}" oninput="S.contact.title=this.value" placeholder="Owner"></div></div>
    <div class="field"><label>Email</label>
      <input type="email" value="${S.contact.email}" oninput="S.contact.email=this.value" placeholder="marco@shop.com"></div>
    <div class="field"><label>Phone</label>
      <input type="tel" value="${S.contact.phone}" oninput="S.contact.phone=this.value" placeholder="(202) 555-0134"></div>
  </div>

  <div class="card">
    <div class="step">Step 3</div>
    <h2>Cards</h2>
    <p class="sub">Name each card, pick its type, and set its own price — whatever you're actually charging for it.</p>
    ${S.cards.some(c=>c.id) ? `
      <p class="note" style="margin-top:-8px;margin-bottom:14px">
        Found ${S.cards.filter(c=>c.id).length} card${S.cards.filter(c=>c.id).length>1?'s':''} already made for this business
        (e.g. a demo tag from Link Maker) — reusing ${S.cards.filter(c=>c.id).length>1?'them':'it'} below,
        same URL that's already written.</p>` : ''}
    ${S.cards.map((c,i)=>`
      <div class="cardrow">
        <input value="${c.label}" oninput="S.cards[${i}].label=this.value" placeholder="Where it goes">
        <select onchange="S.cards[${i}].type=this.value">
          ${['stand','placard','badge','card'].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <input class="price" type="text" inputmode="decimal"
               value="${c.price}" oninput="S.cards[${i}].price=this.value;updateSubtotal()" placeholder="$">
        <button class="del" onclick="S.cards.splice(${i},1);render()">✕</button>
      </div>`).join('')}
    <button class="btn ghost sm" onclick="S.cards.push({label:'',type:'placard',price:''});render()">+ Add card</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div><div class="p2" style="font-size:13px;color:var(--muted)">Collect</div>
      <div id="collectTotal" style="font-size:26px;font-weight:700">$${subtotal().toFixed(2)}</div></div>
    </div>
    <button class="btn" onclick="doCreate()" ${S.busy?'disabled':''}>
      ${S.busy?'Creating…':'Create and get links'}</button>
    ${S.err?`<div class="err">${S.err}</div>`:''}
  </div>`;
}

function vTags(){
  const c = S.created;
  const dashUrl = dashboardUrl(c.business.id);
  return `
  <div class="card">
    <h2>${c.business.name}'s dashboard</h2>
    <p class="sub">Text or email this link — it opens straight to their numbers, no login or ID to type.</p>
    <div class="link">${dashUrl}</div>
    <button class="btn ghost" onclick="copyDash('${dashUrl}')">Copy link</button>
    <div class="note" id="stdash"></div>
  </div>

  <div class="card">
    <h2>${c.business.name} is set up</h2>
    <p class="sub">${NFC_OK
      ? 'Hold each card to the top of your phone and press Write.'
      : 'Copy each link, then write it in the NFC Tools app (Write › Add record › URL).'}</p>
    ${!NFC_OK?`<div class="warn">This iPhone can’t write NFC tags from a browser — Apple doesn’t support it.
      Everything else is done; only the write step needs NFC Tools.</div>`:''}
    ${c.cards.map((k,i)=>`
      <div class="tagbox">
        <div class="lbl">${k.label}</div>
        <div class="ty">${k.card_type}</div>
        <div class="link">${k.url}</div>
        <div class="row">
          ${NFC_OK?`<button class="btn" onclick="writeTag('${k.url}',${i})">Write to card</button>`:''}
          <button class="btn ghost" onclick="copy('${k.url}',${i})">Copy link</button>
        </div>
        <div class="note" id="st${i}"></div>
      </div>`).join('')}
  </div>

  <div class="card">
    <div class="step">Before you leave</div>
    <div class="checklist">
      ${['Tap-test every card on your own phone',
         'Place the stand where customers pay',
         'Book the 30-day check-in now, on their calendar',
         'Coach staff: ask every customer honestly, never request 5 stars',
         'Text or email the dashboard link above to '+(S.contact.email||S.contact.phone||'them')]
        .map(t=>`<div><span class="dot"></span>${t}</div>`).join('')}
    </div>
  </div>

  <button class="btn ghost" onclick="resetAll()">Set up another business</button>`;
}

render();
</script>
</body>
</html>
